<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip - Tie Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="casino-background">
        <header class="game-header">
            <h1 class="game-page-title">COIN FLIP</h1>
            <p class="game-subtitle">Heads or Tails - Let Fate Decide</p>
        </header>

        <main class="game-arena">
            <div class="coin-container">
                <div class="coin-display">
                    <div class="coin heads-side">
                        <div class="coin-face">HEADS</div>
                    </div>
                </div>
                
                <div class="flip-controls">
                    <button class="mega-flip-btn">FLIP COIN</button>
                    <p class="result-text">Ready to flip?</p>
                </div>
            </div>

            <div class="game-stats">
                <div class="stat-card">
                    <h3>Last Result</h3>
                    <p class="stat-value">-</p>
                </div>
                <div class="stat-card">
                    <h3>Heads Count</h3>
                    <p class="stat-value">0</p>
                </div>
                <div class="stat-card">
                    <h3>Tails Count</h3>
                    <p class="stat-value">0</p>
                </div>
            </div>
        </main>

        <footer class="game-footer">
    <a href="index.html" class="lobby-btn">← BACK TO LOBBY</a>
</footer>

</footer>
</body>
</html>
