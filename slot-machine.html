<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Secret Slots - Tie Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="casino-background">
        <header class="game-header">
            <h1 class="game-page-title">🎰 SECRET SLOTS 🎰</h1>
            <p class="game-subtitle">You Found the Hidden Casino!</p>
        </header>

        <main class="game-arena">
            <div class="slot-container">
                <div class="slot-machine">
                    <div class="slot-display">
                        <div class="slot-reel reel-1">
                            <div class="slot-symbol">🍒</div>
                        </div>
                        <div class="slot-reel reel-2">
                            <div class="slot-symbol">🍋</div>
                        </div>
                        <div class="slot-reel reel-3">
                            <div class="slot-symbol">🍊</div>
                        </div>
                    </div>
                    
                    <div class="slot-controls">
                        <div class="credits-display">
                            <span class="credits-label">CREDITS:</span>
                            <span class="credits-value">100</span>
                        </div>
                        
                        <button class="mega-spin-btn slot-spin-btn">🎰 SPIN TO WIN 🎰</button>
                        
                        <div class="payout-info">
                            <p class="payout-text">🍒🍒🍒 = JACKPOT!</p>
                            <p class="payout-text">🍋🍋🍋 = BIG WIN!</p>
                            <p class="payout-text">🍊🍊🍊 = NICE WIN!</p>
                        </div>
                    </div>
                </div>

                <div class="slot-message">
                    <p class="result-text">Push the button and test your luck!</p>
                </div>
            </div>

            <div class="game-stats">
                <div class="stat-card">
                    <h3>Last Spin</h3>
                    <p class="stat-value">-</p>
                </div>
                <div class="stat-card">
                    <h3>Biggest Win</h3>
                    <p class="stat-value">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Spins</h3>
                    <p class="stat-value">0</p>
                </div>
            </div>
        </main>

        <footer class="game-footer">
            <a href="index.html" class="lobby-btn">← BACK TO LOBBY</a>
        </footer>
    </div>
</body>
</html>
