<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tie Breaker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="casino-background">
        <header class="main-header">
            <h1 class="neon-title">TIE BREAKER</h1>
            <p class="tagline">Where Luck Meets Decision</p>
        </header>

        <main class="casino-lobby">
            <div class="game-cards-container">
    
    <div class="game-card coin-card">
        <div class="card-glow"></div>
        <div class="card-content">
            <div class="game-icon">🪙</div>
            <h2 class="game-title">COIN FLIP</h2>
            <p class="game-description">Classic heads or tails</p>
            <a href="coin-flip.html" class="play-btn">FLIP NOW</a>
        </div>
    </div>

    <div class="game-card dice-card">
        <div class="card-glow"></div>
        <div class="card-content">
            <div class="game-icon">🎲</div>
            <h2 class="game-title">DICE ROLL</h2>
            <p class="game-description">3-30 sided dice action</p>
            <a href="dice-roll.html" class="play-btn">ROLL NOW</a>
        </div>
    </div>

    <div class="game-card wheel-card">
        <div class="card-glow"></div>
        <div class="card-content">
            <div class="game-icon">🎰</div>
            <h2 class="game-title">SPIN WHEEL</h2>
            <p class="game-description">Custom fortune wheel</p>
            <a href="spin-wheel.html" class="play-btn">SPIN NOW</a>
        </div>
    </div>

</div>


            </div>
        </main>

        <footer class="casino-footer">
         <a href="slot-machine.html" class="hidden-slot-link">
         <h3>Ready to Break the Tie?</h3>
         </a>
        </footer>

    </div>
</body>
</html>
